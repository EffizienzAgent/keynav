name: keynav-dev

services:
  db:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: "123"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:8-alpine

  bench:
    image: frappe/bench:v5.31.0
    command: sleep infinity
    working_dir: /home/frappe/bench-data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ..:/workspace/keynav
      - bench-data:/home/frappe/bench-data

  screenshots:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: [screenshots]
    working_dir: /workspace/keynav
    environment:
      BASE_URL: http://bench:8000
    volumes:
      - ..:/workspace/keynav
    command: bash -c "npm install --prefix /tmp/pw --no-save --silent playwright@1.55.0 && cp dev/screenshots.mjs /tmp/pw/ && node /tmp/pw/screenshots.mjs"

volumes:
  db-data:
  bench-data:
